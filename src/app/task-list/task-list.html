<div>
  <!-- Filtro de estados -->
  <select (change)="onFilterChange($event)">
    <option value="">Todos los estados</option>
    <option *ngFor="let status of statuses" [value]="status.id">
      {{ status.name }}
    </option>
  </select>

   <!-- Lista de tareas -->
  <ul>
    <li *ngFor="let task of tasks">
      {{ task.title }} - {{ task.statusName }}
      <!-- Selector para cambiar estado -->
      <select (change)="onStatusChange(task.id, $event)">
        <option *ngFor="let status of statuses" [value]="status.id" [selected]="task.statusId === status.id">
          {{ status.name }}
        </option>
      </select>
    </li>
  </ul>
</div>
