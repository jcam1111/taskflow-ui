<div class="task-list-container">
  
  <!-- Encabezado con título y filtro -->
  <div class="task-list-header">
    <h2>Lista de Tareas</h2>
    <select (change)="onFilterChange($event)" aria-label="Filtrar tareas por estado">
      <option value="">Todos los estados</option>
      <!-- CORREGIDO: Se cambió status.title a status.name -->
      <option *ngFor="let status of statuses" [value]="status.id">
        {{ status.name }}
      </option>
    </select>
  </div>

  <!-- Contenedor de la lista de tareas -->
  <div *ngIf="tasks.length > 0; else noTasks">
    <ul class="tasks-ul">
      <li *ngFor="let task of tasks" class="task-item" [attr.data-status]="task.statusName">
        
        <div class="task-content">
          <span class="task-title">{{ task.title }}</span>
          <span class="task-status-badge">{{ task.statusName }}</span>
        </div>
        
        <div class="task-actions">
          <select (change)="onStatusChange(task.id, $event)" [value]="task.statusId" aria-label="Cambiar estado de la tarea">
            <!-- CORREGIDO: Se cambió status.title a status.name -->
            <option *ngFor="let status of statuses" [value]="status.id">
              {{ status.name }}
            </option>
          </select>
        </div>

      </li>
    </ul>
  </div>

  <!-- Plantilla que se muestra si no hay tareas -->
  <ng-template #noTasks>
    <div class="no-tasks-message">
      <p>No hay tareas para mostrar. ¡Intenta con otro filtro o crea una nueva tarea!</p>
    </div>
  </ng-template>

</div>
