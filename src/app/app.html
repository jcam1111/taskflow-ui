<header>
  <nav class="main-nav">
    <h1>TaskFlow</h1>
    <ul>
      <li>
        <!-- routerLink: Navega a la ruta sin recargar la página -->
        <!-- routerLinkActive: Aplica una clase CSS cuando la ruta está activa -->
        <a routerLink="/tasks" routerLinkActive="active">Gestión de Tareas</a>
      </li>
      <li>
        <a routerLink="/users" routerLinkActive="active">Gestión de Usuarios</a>
      </li>
    </ul>
  </nav>
</header>


<main class="container">
  <!-- Aquí es donde Angular renderizará tus componentes (TaskListComponent, TaskFormComponent, etc.) -->
  <router-outlet></router-outlet>
</main>
